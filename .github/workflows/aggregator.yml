name: State Vacancies Daily Aggregator

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'aggregator'
  cancel-in-progress: true

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run State Jobs Aggregator
        run: node scripts/scrape-state-jobs.js

      - name: Build Static Directories and Feeds
        run: node scripts/build-jobs.js

      - name: Commit and Push Updates
        run: |
          git config --global user.name "BestJobs Aggregator Bot"
          git config --global user.email "office@bestjobs.bg"
          git add data/jobs.json bestjobs/ all-jobs.xml vip-jobs.xml sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): aggregate state vacancies [skip ci]" && git push origin main)
