name: Deploy Static BestJobs Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Vacancy Directories and XML Feeds
        run: node scripts/build-jobs.js

      - name: Commit and Push Generated Vacancy Folders to Main
        run: |
          git config --global user.name "BestJobs Build Bot"
          git config --global user.email "office@bestjobs.bg"
          git add bestjobs/ data/ all-jobs.xml vip-jobs.xml sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(build): persist vacancy directories and catalogs [skip ci]" && git push origin main)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Static Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages Edge
        id: deployment
        uses: actions/deploy-pages@v4
